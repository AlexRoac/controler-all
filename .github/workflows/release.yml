name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build embedded web application
        shell: pwsh
        run: |
          npm ci
          npm run build:web

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Build portable executable
        run: cargo build --release -p remotepad-server --locked

      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item target/release/remotepad-server.exe package/RemotePad.exe
          Copy-Item README.md package/README.md
          Copy-Item LICENSE package/LICENSE
          Compress-Archive -Path package/* -DestinationPath RemotePad-windows-x64.zip

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemotePad-windows-x64
          path: RemotePad-windows-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" RemotePad-windows-x64.zip --generate-notes --title "RemotePad ${{ github.ref_name }}"

